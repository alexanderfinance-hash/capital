services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital
      POSTGRES_DB: capital
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Bound to localhost only — DB is never exposed to the public internet.
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://capital:capital@db:5432/capital?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-change-me-to-a-long-random-string}"
      APP_EMAIL: "${APP_EMAIL:-admin@capital.local}"
      APP_PASSWORD: "${APP_PASSWORD:-capital123}"
      NODE_ENV: "production"
      # integrations
      GOOGLE_SHEETS_ID: "${GOOGLE_SHEETS_ID:-}"
      GOOGLE_SHEETS_EXPENSES_TAB: "${GOOGLE_SHEETS_EXPENSES_TAB:-Отчет}"
      GOOGLE_SHEETS_CATEGORIES_TAB: "${GOOGLE_SHEETS_CATEGORIES_TAB:-Категории }"
      GOOGLE_SERVICE_ACCOUNT_JSON: "${GOOGLE_SERVICE_ACCOUNT_JSON:-}"
      FX_USD_RUB: "${FX_USD_RUB:-95}"
      EXPENSE_EXCLUDE: "${EXPENSE_EXCLUDE:-Снятие наличных,Обналичивание крипты}"
      CMC_API_KEY: "${CMC_API_KEY:-}"
      EVM_RPC_URL: "${EVM_RPC_URL:-}"
      BSC_RPC_URL: "${BSC_RPC_URL:-}"
      TRONGRID_API_KEY: "${TRONGRID_API_KEY:-}"
      TON_API_KEY: "${TON_API_KEY:-}"
      # Telegram (agency balances pulled from the company chat)
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_REPORT_MARKER: "${TELEGRAM_REPORT_MARKER:-}"
      TELEGRAM_AGENCY_AUTOCREATE: "${TELEGRAM_AGENCY_AUTOCREATE:-true}"
      # Webhook mode (when outbound to api.telegram.org is blocked): set a secret
      # and register the webhook (see TELEGRAM.md). Polling turns off automatically.
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      # CoinLink payable (external read-only Postgres → company "available to withdraw")
      COINLINK_DATABASE_URL: "${COINLINK_DATABASE_URL:-}"
      COINLINK_DB_HOST: "${COINLINK_DB_HOST:-}"
      COINLINK_DB_PORT: "${COINLINK_DB_PORT:-}"
      COINLINK_DB_NAME: "${COINLINK_DB_NAME:-}"
      COINLINK_DB_USER: "${COINLINK_DB_USER:-}"
      COINLINK_DB_PASSWORD: "${COINLINK_DB_PASSWORD:-}"
      COINLINK_DB_SSL: "${COINLINK_DB_SSL:-}"
      COINLINK_PAYABLE_VIEW: "${COINLINK_PAYABLE_VIEW:-coinlink_payable}"
      COINLINK_TOTAL_FN: "${COINLINK_TOTAL_FN:-coinlink_payable_total}"
      COINLINK_BY_PARTNER_FN: "${COINLINK_BY_PARTNER_FN:-coinlink_payable_by_partner}"
      COINLINK_PERIOD_FROM: "${COINLINK_PERIOD_FROM:-}"
      CRON_SECRET: "${CRON_SECRET:-change-me-cron-secret}"
      # Service-account key is mounted (below) rather than baked into the image.
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/google-service-account.json}"
    volumes:
      - ./secrets:/app/secrets:ro
    # Bound to localhost; public traffic goes through Caddy (docker-compose.prod.yml).
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_URL: "http://app:3000"
      CRON_SECRET: "${CRON_SECRET:-change-me-cron-secret}"
      SYNC_CRYPTO_CRON: "${SYNC_CRYPTO_CRON:-*/10 * * * *}"
      SYNC_EXPENSES_CRON: "${SYNC_EXPENSES_CRON:-0 * * * *}"
      SYNC_TELEGRAM_CRON: "${SYNC_TELEGRAM_CRON:-*/15 * * * *}"
      SYNC_COINLINK_CRON: "${SYNC_COINLINK_CRON:-*/30 * * * *}"
    # Bypass the migrate/seed entrypoint — only the app runs migrations.
    entrypoint: ["npm", "run", "worker"]

volumes:
  pgdata:
