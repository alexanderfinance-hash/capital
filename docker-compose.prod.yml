# Production overlay: adds Caddy reverse proxy with automatic HTTPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    # Явные DNS: иначе Caddy не резолвит acme-*.letsencrypt.org (stub 127.0.0.53
    # изнутри контейнера недоступен) и не получает TLS-сертификат.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
