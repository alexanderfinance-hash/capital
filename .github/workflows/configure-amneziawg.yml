name: Configure AmneziaWG (Telegram split-tunnel)

# Поднимает AmneziaWG (обфусцированный WireGuard, обход DPI) на VPS в режиме
# split-tunnel: через туннель идёт ТОЛЬКО трафик к адресам Telegram, остальное
# (дашборд, БД) — напрямую. Затем снимает webhook и возвращает бота на поллинг
# (getUpdates через VPN). Конфиг берётся из секрета WG_CONFIG (полный текст .conf
# c параметрами Jc/Jmin/Jmax/S1/S2/H1–H4 — их сохраняем как есть).
#
# Запуск: Actions → Configure AmneziaWG (Telegram split-tunnel) → Run workflow.
# Предусловия: секреты VPS_* и WG_CONFIG (AmneziaWG-конфиг), DEPLOY_ENABLED=true,
# SSH-пользователь с root/sudo (нужно ставить пакеты и поднимать VPN на хосте).
on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Encode WG config (avoid multiline env issues)
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          if [ -z "$WG_CONFIG" ]; then echo "Секрет WG_CONFIG пуст"; exit 1; fi
          echo "WG_B64=$(printf '%s' "$WG_CONFIG" | base64 -w0)" >> "$GITHUB_ENV"

      - name: Bring up AmneziaWG split-tunnel over SSH
        uses: appleboy/ssh-action@v1
        env:
          WG_B64: ${{ env.WG_B64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: WG_B64
          script_stop: false
          command_timeout: 20m
          script: |
            set -e
            cd /opt/capital || { echo "Нет каталога /opt/capital"; exit 1; }
            SUDO=''; [ "$(id -u)" -ne 0 ] && SUDO=sudo
            export DEBIAN_FRONTEND=noninteractive

            # 0) Снять старый ванильный wg-туннель tgwg, если был (чтобы не держал
            #    интерфейс и не поднимался на загрузке с несовместимым конфигом).
            $SUDO systemctl disable wg-quick@tgwg 2>/dev/null || true
            $SUDO wg-quick down tgwg 2>/dev/null || true

            # 1) amneziawg (awg-quick + модуль ядра через DKMS)
            if ! command -v awg-quick >/dev/null 2>&1; then
              echo "→ устанавливаю amneziawg (PPA amnezia)"
              $SUDO apt-get update -qq || true
              $SUDO apt-get install -y -qq software-properties-common dkms "linux-headers-$(uname -r)" \
                || echo "! linux-headers/dkms могли не поставиться — DKMS-сборка модуля может упасть"
              $SUDO add-apt-repository -y ppa:amnezia/ppa \
                || { echo "✗ не удалось добавить PPA amnezia (не-Ubuntu?)"; exit 1; }
              $SUDO apt-get update -qq || true
              $SUDO apt-get install -y -qq amneziawg \
                || $SUDO apt-get install -y -qq amneziawg-tools amneziawg-dkms \
                || { echo "✗ не удалось установить amneziawg"; exit 1; }
            fi

            # 2) загрузить модуль (DKMS-сборка под текущее ядро)
            $SUDO modprobe amneziawg 2>/dev/null || echo "! modprobe amneziawg не сработал (проверим при up)"

            # 3) конфиг: split-tunnel только на Telegram, без DNS; параметры
            #    обфускации (Jc/Jmin/Jmax/S1/S2/H1–H4) НЕ трогаем.
            TG_CIDRS="149.154.160.0/20,149.154.164.0/22,149.154.168.0/22,149.154.172.0/22,91.108.4.0/22,91.108.8.0/22,91.108.12.0/22,91.108.16.0/22,91.108.56.0/22,95.161.64.0/20"
            $SUDO mkdir -p /etc/amnezia/amneziawg
            echo "$WG_B64" | base64 -d | $SUDO tee /etc/amnezia/amneziawg/tgwg.conf >/dev/null
            $SUDO sed -i '/^[[:space:]]*DNS[[:space:]]*=/d' /etc/amnezia/amneziawg/tgwg.conf
            $SUDO sed -i "s|^[[:space:]]*AllowedIPs[[:space:]]*=.*|AllowedIPs = ${TG_CIDRS}|" /etc/amnezia/amneziawg/tgwg.conf
            $SUDO chmod 600 /etc/amnezia/amneziawg/tgwg.conf

            # 4) поднять (идемпотентно) + автозапуск
            $SUDO awg-quick down tgwg 2>/dev/null || true
            $SUDO awg-quick up tgwg || { echo "✗ awg-quick up не удался"; $SUDO dmesg 2>/dev/null | tail -20; exit 1; }
            $SUDO systemctl enable awg-quick@tgwg 2>/dev/null || true
            echo "→ AmneziaWG tgwg поднят (split-tunnel: только Telegram)"
            $SUDO awg show tgwg 2>&1 | sed -n '1,12p' || true

            # 5) проверка связи (Telegram теперь через VPN)
            code=$($SUDO curl -s -o /dev/null -m 15 -w "%{http_code}" https://api.telegram.org 2>/dev/null || echo fail)
            echo "host → api.telegram.org: $code  (200/404 = связь есть; fail/000 = нет)"

            # 6) вернуть бота на поллинг: снять webhook, убрать webhook-секрет, рестарт
            TOKEN=$(grep -E '^TELEGRAM_BOT_TOKEN=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
            if [ -n "$TOKEN" ]; then
              echo -n "deleteWebhook: "; curl -s -m 15 "https://api.telegram.org/bot$TOKEN/deleteWebhook" | head -c 200; echo
            fi
            grep -vE '^(TELEGRAM_WEBHOOK_SECRET|TELEGRAM_PROXY)=' .env > .env.tmp 2>/dev/null || true
            mv .env.tmp .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app worker >/dev/null 2>&1 || \
              docker compose up -d app worker >/dev/null 2>&1 || true
            echo "→ webhook снят, бот на поллинге (getUpdates через VPN), контейнеры перезапущены"
