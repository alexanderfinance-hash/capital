name: Fix caddy cert

# Перезапускает docker-демон (пересоздаёт сети и iptables-NAT начисто — лечит
# ситуацию, когда один контейнер не выходит в интернет при рабочих остальных),
# поднимает стек и проверяет, получил ли Caddy TLS-сертификат.
on:
  workflow_dispatch: {}

jobs:
  fix:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restart docker and verify caddy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            echo "=== перезапуск docker-демона ==="
            sudo systemctl restart docker
            sleep 15
            echo "=== поднимаем стек ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d 2>&1 | tail -8
            echo "=== ждём 40с ==="
            sleep 40
            echo "=== caddy до acme letsencrypt ==="
            docker exec capital-caddy-1 sh -c 'wget -q -T 8 -O /dev/null https://acme-v02.api.letsencrypt.org/directory && echo "caddy LE OK" || echo "caddy LE FAIL"' 2>&1 | tail -2
            echo "=== логи caddy по сертификату ==="
            docker logs --tail 40 capital-caddy-1 2>&1 | grep -iE 'certificate obtained|obtaining|got renewal|acme|error|unreachable|serving initial|ready for handshake' | tail -15
            echo "=== HTTPS локально через caddy ==="
            curl -sS -m 10 -o /dev/null -w "HTTPS: %{http_code}\n" --resolve alex-finance.pro:443:127.0.0.1 https://alex-finance.pro/ 2>&1 | tail -2
