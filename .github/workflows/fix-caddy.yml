name: Fix caddy cert

# Чистый down → up стека (демон docker уже с обновлёнными сетями), затем проверка
# выхода caddy в интернет и выдачи TLS-сертификата.
on:
  workflow_dispatch: {}

jobs:
  fix:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Recreate stack and verify caddy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            echo "=== down ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down 2>&1 | tail -6
            echo "=== кто на 80/443 после down ==="
            sudo ss -ltnp 2>/dev/null | grep -E ':80 |:443 ' || echo "(80/443 свободны)"
            echo "=== up ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d 2>&1 | tail -10
            echo "=== ждём 45с ==="
            sleep 45
            echo "=== состояние контейнеров ==="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps 2>&1 | tail -8
            echo "=== caddy до acme letsencrypt ==="
            docker exec capital-caddy-1 sh -c 'wget -q -T 8 -O /dev/null https://acme-v02.api.letsencrypt.org/directory && echo "caddy LE OK" || echo "caddy LE FAIL"' 2>&1 | tail -2
            echo "=== логи caddy по сертификату ==="
            docker logs --tail 40 capital-caddy-1 2>&1 | grep -iE 'certificate obtained|obtaining|got renewal|acme|error|unreachable|serving initial|ready for handshake' | tail -15
            echo "=== HTTPS локально через caddy ==="
            curl -sS -m 10 -o /dev/null -w "HTTPS: %{http_code}\n" --resolve alex-finance.pro:443:127.0.0.1 https://alex-finance.pro/ 2>&1 | tail -2
