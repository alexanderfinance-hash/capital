name: Check tron

# Сверка балансов личных TRON-адресов: индексатор /v1/accounts (его использует
# провайдер) vs «наземный» узел /wallet/getaccount (истинное состояние). Если
# расходятся — виноват устаревший индексатор, и провайдер надо переключить.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            ADDRS=$(docker exec capital-db-1 psql -U capital -d capital -tA -c "SELECT address FROM \"Wallet\" WHERE scope='personal' AND chain='TRX';" 2>/dev/null | tr '\n' ' ')
            echo "addresses: $ADDRS"
            docker exec -e ADDRS="$ADDRS" capital-app-1 node -e '
              const addrs=(process.env.ADDRS||"").trim().split(/\s+/).filter(Boolean);
              const key=process.env.TRONGRID_API_KEY;const H=key?{"TRON-PRO-API-KEY":key}:{};
              const s=v=>(Number(v||0)/1e6).toFixed(2);
              (async()=>{for(const a of addrs){try{
                const r1=await (await fetch("https://api.trongrid.io/v1/accounts/"+a,{headers:H})).json();
                const d1=(r1.data&&r1.data[0])||{};
                const r2=await (await fetch("https://api.trongrid.io/wallet/getaccount",{method:"POST",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({address:a,visible:true})})).json();
                const fv2=(o)=>(o.frozenV2||[]).reduce((x,f)=>x+Number(f.amount||0),0);
                console.log(a);
                console.log("  /v1/accounts:  liquid",s(d1.balance),"frozenV2",s(fv2(d1)));
                console.log("  /wallet/getaccount: liquid",s(r2.balance),"frozenV2",s(fv2(r2)),"| raw keys:",Object.keys(r2).join(","));
              }catch(e){console.log(a,"ERR",String(e&&e.cause||e).slice(0,120));}}})();
            ' 2>&1 | tail -14
