name: Check tron

# Разовая проверка: сырой ответ TronGrid по личным TRON-адресам — где лежит TRX
# (ликвидный balance vs замороженный frozenV2/frozen/energy/delegated/unfrozen).
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            ADDRS=$(docker exec capital-db-1 psql -U capital -d capital -tA -c "SELECT address FROM \"Wallet\" WHERE scope='personal' AND chain='TRX';" 2>/dev/null | tr '\n' ' ')
            echo "personal TRON addresses: $ADDRS"
            docker exec -e ADDRS="$ADDRS" capital-app-1 node -e '
              const addrs=(process.env.ADDRS||"").trim().split(/\s+/).filter(Boolean);
              const key=process.env.TRONGRID_API_KEY;
              (async()=>{for(const a of addrs){try{
                const r=await fetch("https://api.trongrid.io/v1/accounts/"+a,{headers:key?{"TRON-PRO-API-KEY":key}:{}});
                const j=await r.json();const d=(j.data&&j.data[0])||{};const ar=d.account_resource||{};
                const s=v=>(Number(v||0)/1e6).toFixed(2);
                const fv2=(d.frozenV2||[]).reduce((x,f)=>x+Number(f.amount||0),0);
                const f1=(d.frozen||[]).reduce((x,f)=>x+Number(f.frozen_balance||0),0);
                console.log(a,"| liquid",s(d.balance),"| frozenV2",s(fv2),"| frozen1.0",s(f1),"| energyFrozen",s(ar.frozen_balance_for_energy&&ar.frozen_balance_for_energy.frozen_balance),"| delegBW",s(d.delegated_frozenV2_balance_for_bandwidth),"| delegEN",s(ar.delegated_frozenV2_balance_for_energy),"| unfrozenV2",s((d.unfrozenV2||[]).reduce((x,u)=>x+Number(u.unfreeze_amount||0),0)));
              }catch(e){console.log(a,"ERR",String(e&&e.cause||e).slice(0,100));}}})();
            ' 2>&1 | tail -10
