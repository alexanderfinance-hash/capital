name: Verify proxy

# Проверка, что общий Caddy отдаёт alex-finance.pro с нашего контейнера и редирект
# ведёт на домен (а не на localhost:3001). Только чтение.
on:
  workflow_dispatch: {}

jobs:
  verify:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            echo "=== app-контейнер напрямую: статус + Location ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/",{redirect:"manual"}).then(r=>console.log("status",r.status,"| location:",r.headers.get("location"))).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,100)))' 2>&1 | tail -2
            echo "=== через общий Caddy: https://alex-finance.pro (корректные SNI+Host) ==="
            curl -sS -m 12 -i --resolve alex-finance.pro:443:127.0.0.1 https://alex-finance.pro/ 2>&1 | sed -n '1,18p'
