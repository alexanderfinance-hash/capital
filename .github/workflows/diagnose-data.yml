name: Diagnose data

# Сравнивает содержимое двух баз: контейнерной (capital-db-1, наша) и хостовой
# (та, что использовало ручное приложение — DATABASE_URL из .env). Нужно понять,
# где реальные данные и пароль, чтобы перенести в контейнерную. Только чтение.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Compare DBs over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            echo "=== КОНТЕЙНЕРНАЯ БД (capital-db-1, наша) ==="
            for t in User Asset Agency Wallet Dividend Reserve; do
              c=$(docker exec capital-db-1 psql -U capital -d capital -tA -c "SELECT count(*) FROM \"$t\"" 2>/dev/null || echo "—")
              echo "  $t = $c"
            done
            echo "=== ХОСТОВАЯ БД (DATABASE_URL из .env — ручное приложение) ==="
            DBURL=$(grep -E '^DATABASE_URL=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
            echo "  url: $(echo "$DBURL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#')"
            PGHOST=$(python3 -c "import urllib.parse as u;print(u.urlparse('$DBURL').hostname or '127.0.0.1')")
            PGPORT=$(python3 -c "import urllib.parse as u;print(u.urlparse('$DBURL').port or 5432)")
            PGUSER=$(python3 -c "import urllib.parse as u;print(u.urlparse('$DBURL').username or 'capital')")
            PGDB=$(python3 -c "import urllib.parse as u;print((u.urlparse('$DBURL').path or '/capital').lstrip('/').split('?')[0])")
            PGPW=$(python3 -c "import urllib.parse as u;print(u.urlparse('$DBURL').password or '')")
            [ "$PGHOST" = "localhost" ] && PGHOST=127.0.0.1
            echo "  подключаюсь к $PGHOST:$PGPORT db=$PGDB user=$PGUSER"
            for t in User Asset Agency Wallet Dividend Reserve; do
              c=$(docker run --rm --network host -e PGPASSWORD="$PGPW" postgres:16 psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDB" -tA -c "SELECT count(*) FROM \"$t\"" 2>/dev/null || echo "— (нет таблицы/недоступно)")
              echo "  $t = $c"
            done
