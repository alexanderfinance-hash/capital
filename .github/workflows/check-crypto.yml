name: Check crypto

# Разовая диагностика крипто-синка: что отдаёт /api/sync/crypto по монетам и по
# сетям, какие символы получили цену, и что лежит в БД (TRON-кошельки, crypto-активы).
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          script: |
            echo "=== крипто-синк сейчас (coins / pricedSymbols / по сетям) ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/crypto",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>{console.log("totalUsd",j.totalUsd);console.log("coins",JSON.stringify((j.coins||[]).map(c=>({s:c.symbol,amt:c.amount,usd:Math.round(c.usd)}))));console.log("pricedSymbols",JSON.stringify(j.pricedSymbols));const per={};(j.wallets||[]).forEach(w=>{(w.holdings||[]).forEach(h=>{per[w.chain]=per[w.chain]||{};per[w.chain][h.symbol]=(per[w.chain][h.symbol]||0)+Number(h.amount);});});console.log("byChain",JSON.stringify(per));const tron=(j.wallets||[]).filter(w=>w.chain==="TRX").map(w=>({usd:Math.round(w.usd),h:w.holdings}));console.log("tronWallets",JSON.stringify(tron).slice(0,800));}).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,200)))' 2>&1 | tail -8
            echo "=== personal TRON-кошельки в БД (chain | balanceUsd | holdingsJson) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT chain, \"balanceUsd\", COALESCE(\"holdingsJson\"::text,'-') FROM \"Wallet\" WHERE scope='personal' AND chain='TRX';" 2>&1 | head -20
            echo "=== crypto-активы в БД (symbol | amount | value) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT symbol, amount, value FROM \"Asset\" WHERE bucket='crypto' AND source='sync' ORDER BY value DESC;" 2>&1 | head -20
