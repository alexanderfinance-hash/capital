name: Diagnose TON balance

# Одноразовая диагностика баланса TON-кошелька по SSH (только вручную): берёт
# адрес из БД и повторяет запрос к toncenter ИЗ контейнера app (тот же сетевой
# путь, что у синка) + кросс-проверка через tonapi.io. Показывает, что реально
# отдаёт API и что лежит в БД.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe TON over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 5m
          script: |
            cd "$HOME/capital" || { echo "Нет каталога ~/capital"; exit 1; }
            echo "=== TON-кошельки в БД (адрес | chain | balance | balanceUsd | holdings | lastSync) ==="
            docker exec capital-db-1 psql -U capital -d capital -t -A -F' | ' -c "SELECT address, chain, balance, \"balanceUsd\", COALESCE(\"holdingsJson\"::text,'-'), to_char(\"lastSyncedAt\",'MM-DD HH24:MI') FROM \"Wallet\" WHERE chain='TON';" 2>&1 | cat
            ADDR=$(docker exec capital-db-1 psql -U capital -d capital -t -A -c "SELECT address FROM \"Wallet\" WHERE chain='TON' ORDER BY \"createdAt\" LIMIT 1;" 2>/dev/null | tr -d '[:space:]')
            echo "adr=[$ADDR]"
            KEY=$(grep -E '^TON_API_KEY=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
            BASE=$(grep -E '^TON_API_URL=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs); BASE=${BASE:-https://toncenter.com/api/v2}
            echo "TON_API_KEY: $([ -n "$KEY" ] && echo задан || echo 'НЕ задан') · BASE=$BASE"
            echo "=== toncenter getAddressInformation (из контейнера app, как в синке) ==="
            docker exec -e A="$ADDR" -e B="$BASE" -e K="$KEY" capital-app-1 node -e 'const u=process.env.B+"/getAddressInformation?address="+encodeURIComponent(process.env.A)+(process.env.K?"&api_key="+process.env.K:"");fetch(u).then(r=>r.text().then(t=>console.log("HTTP",r.status,t.slice(0,600)))).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,120)))' 2>&1 | cat
            echo
            echo "=== tonapi.io кросс-проверка (native balance, nanoton) ==="
            docker exec -e A="$ADDR" capital-app-1 node -e 'fetch("https://tonapi.io/v2/accounts/"+encodeURIComponent(process.env.A)).then(r=>r.text().then(t=>console.log("HTTP",r.status,t.slice(0,500)))).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,120)))' 2>&1 | cat
