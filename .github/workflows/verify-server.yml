name: Verify server config

# Безопасная диагностика сервера по SSH. Проверяет ТОЛЬКО факт наличия ключей
# (выводит «задан» / «не задан»), сами значения наружу не выводятся.
# Запуск только вручную: Actions → Verify server config → Run workflow.
on:
  workflow_dispatch: {}

jobs:
  verify:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            cd "$HOME/capital" || { echo "Нет каталога ~/capital"; exit 1; }
            echo "=== .env: факт наличия (без значений) ==="
            for k in TRONGRID_API_KEY CMC_API_KEY DOMAIN APP_PASSWORD AUTH_SECRET CRON_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
              v=$(grep -E "^${k}=" .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
              if [ -n "$v" ]; then echo "$k: задан"; else echo "$k: НЕ задан / пуст"; fi
            done
            # Реальный запрос в TronGrid делает контейнер app (worker лишь дёргает его API).
            echo "=== контейнер app: видит ли TRONGRID_API_KEY ==="
            if docker exec capital-app-1 sh -c '[ -n "$TRONGRID_API_KEY" ]' 2>/dev/null; then
              echo "app: TRONGRID_API_KEY задан"
            else
              echo "app: TRONGRID_API_KEY НЕ задан (или контейнер недоступен)"
            fi
            # Автосинк выполняет контейнер worker (node-cron, крипта раз в 10 мин).
            # Его логи показывают каждый запуск и HTTP-ответ синка (200 = успех).
            echo "=== контейнер worker: статус (аптайм = крутится по расписанию) ==="
            docker ps --filter "name=capital-worker-1" --format '{{.Names}}: {{.Status}}' || echo "worker: контейнер не найден"
            echo "=== worker: последние строки автосинка ==="
            docker logs --tail 25 capital-worker-1 2>&1 | tail -25 || echo "worker: логи недоступны"
            # Telegram-синк: ищем его строки в логах и делаем пробный вызов сейчас,
            # чтобы увидеть ответ (consumed/updated/created + распознанные агентства).
            echo "=== telegram: строки синка в логах воркера ==="
            docker logs --tail 300 capital-worker-1 2>&1 | grep "/api/sync/telegram" | tail -3 || echo "нет строк telegram в логах"
            echo "=== telegram: пробный синк сейчас ==="
            CRON=$(grep -E "^CRON_SECRET=" .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
            curl -s -m 30 -X POST -H "x-cron-key: $CRON" http://127.0.0.1:3000/api/sync/telegram | head -c 800 || echo "telegram: запрос не выполнен"
            echo
            # Сетевая проба до Telegram ИЗ контейнера app (тот же путь, что у синка):
            # DNS + HTTP-код. Любой код (404/200) = связь есть; FAIL = недоступно.
            echo "=== telegram: связь app → api.telegram.org ==="
            docker exec capital-app-1 sh -c 'getent hosts api.telegram.org >/dev/null 2>&1 && echo "DNS: ок" || echo "DNS: НЕ резолвится"' 2>/dev/null || echo "app: контейнер недоступен"
            docker exec capital-app-1 node -e 'fetch("https://api.telegram.org",{signal:AbortSignal.timeout(10000)}).then(r=>console.log("HTTP:",r.status)).catch(e=>console.log("FAIL:",String(e&&e.cause||e).slice(0,80)))' 2>/dev/null || echo "app → telegram: проба не выполнена"
