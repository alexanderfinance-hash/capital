name: Verify server config

# Безопасная диагностика сервера по SSH. Проверяет ТОЛЬКО факт наличия ключей
# (выводит «задан» / «не задан»), сами значения наружу не выводятся.
# Запуск только вручную: Actions → Verify server config → Run workflow.
on:
  workflow_dispatch: {}

jobs:
  verify:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            cd "$HOME/capital" || { echo "Нет каталога ~/capital"; exit 1; }
            echo "=== .env: факт наличия (без значений) ==="
            for k in TRONGRID_API_KEY CMC_API_KEY DOMAIN APP_PASSWORD AUTH_SECRET CRON_SECRET; do
              v=$(grep -E "^${k}=" .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
              if [ -n "$v" ]; then echo "$k: задан"; else echo "$k: НЕ задан / пуст"; fi
            done
            # Реальный запрос в TronGrid делает контейнер app (worker лишь дёргает его API).
            echo "=== контейнер app: видит ли TRONGRID_API_KEY ==="
            if docker exec capital-app-1 sh -c '[ -n "$TRONGRID_API_KEY" ]' 2>/dev/null; then
              echo "app: TRONGRID_API_KEY задан"
            else
              echo "app: TRONGRID_API_KEY НЕ задан (или контейнер недоступен)"
            fi
