name: Configure Telegram

# Разовая настройка интеграции с Telegram БЕЗ ручного входа на сервер.
# Берёт TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID из GitHub Secrets и прописывает их
# в ~/capital/.env на сервере по тому же SSH-каналу, что и авто-деплой, затем
# перезапускает контейнеры. Значения секретов в логи не выводятся.
#
# Запуск: вкладка Actions → Configure Telegram → Run workflow.
# Предусловия: заданы секреты VPS_* (как для деплоя) и переменная
# DEPLOY_ENABLED=true, а также секреты TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID.
on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write Telegram secrets to server .env
        uses: appleboy/ssh-action@v1
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_HOOK: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TG_TOKEN,TG_CHAT,TG_HOOK
          script_stop: true
          script: |
            set -e
            cd /opt/capital || { echo "Нет каталога /opt/capital"; exit 1; }
            if [ -z "$TG_TOKEN" ]; then
              echo "Секрет TELEGRAM_BOT_TOKEN пуст — задайте его в Settings → Secrets → Actions"; exit 1;
            fi
            touch .env
            # Убрать прежние строки TELEGRAM_* и дописать свежие (идемпотентно).
            grep -vE '^(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TELEGRAM_WEBHOOK_SECRET)=' .env > .env.tmp 2>/dev/null || true
            mv .env.tmp .env
            printf 'TELEGRAM_BOT_TOKEN="%s"\n' "$TG_TOKEN" >> .env
            printf 'TELEGRAM_CHAT_ID="%s"\n' "$TG_CHAT" >> .env
            [ -n "$TG_HOOK" ] && printf 'TELEGRAM_WEBHOOK_SECRET="%s"\n' "$TG_HOOK" >> .env
            echo "→ .env обновлён (TELEGRAM_BOT_TOKEN: задан; TELEGRAM_CHAT_ID: ${TG_CHAT:+задан}${TG_CHAT:-пуст}; TELEGRAM_WEBHOOK_SECRET: ${TG_HOOK:+задан}${TG_HOOK:-пуст})"
            # Пересоздать контейнеры с новым окружением.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "→ Контейнеры перезапущены. Воркер дёрнет /api/sync/telegram по расписанию."
