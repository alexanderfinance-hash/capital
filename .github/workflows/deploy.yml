name: Deploy to VPS

# Автоматический деплой прод-ветки на сервер по SSH.
# Срабатывает только после настройки секретов и переменной DEPLOY_ENABLED
# (см. DEPLOY.md → раздел «Авто-деплой (CI/CD)»). До этого job пропускается,
# а не падает с ошибкой.
on:
  push:
    branches: [claude/dreamy-johnson-pUcCJ]
    # Изменения только в CI-воркфлоу и документации не требуют пересборки/
    # передеплоя контейнеров (воркфлоу читаются раннером сами).
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch: {}

# Не запускать два деплоя одновременно.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Пока в Settings → Variables не задана DEPLOY_ENABLED=true — job не выполняется.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            # Ищем каталог репозитория по разным вариантам расположения, чтобы не
            # зависеть от того, куда его склонировали на сервере.
            cd /opt/capital 2>/dev/null \
              || cd /root/capital 2>/dev/null \
              || cd "$HOME/capital" 2>/dev/null \
              || { echo "Каталог репозитория не найден (пробовал /opt/capital, /root/capital, ~/capital)"; exit 1; }
            echo "Каталог выкладки: $(pwd)"
            git fetch origin
            git checkout claude/dreamy-johnson-pUcCJ
            git pull --ff-only origin claude/dreamy-johnson-pUcCJ
            ./deploy.sh
