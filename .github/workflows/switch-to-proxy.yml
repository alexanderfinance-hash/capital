name: Switch to external proxy

# Включает режим «за внешним reverse-proxy» (EXTERNAL_PROXY=true, PROXY_PORT=3001)
# в .env на сервере и деплоит: поднимает app+db+worker без своего Caddy, отдаёт
# приложение на 127.0.0.1:3001 (туда проксирует общий хостовый Caddy → alex-finance.pro).
# ВАЖНО: перед запуском ручной next-server на 3001 должен быть остановлен.
on:
  workflow_dispatch: {}

jobs:
  switch:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable proxy mode and deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 15m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            echo "=== проверяю, свободен ли 3001 ==="
            if sudo ss -ltnp 2>/dev/null | grep -q ':3001 '; then
              echo "✗ порт 3001 ещё занят (ручной next-server не остановлен) — прерываю"; sudo ss -ltnp | grep ':3001 '; exit 1
            fi
            echo "=== включаю EXTERNAL_PROXY в .env ==="
            grep -q '^EXTERNAL_PROXY=' .env && sed -i 's/^EXTERNAL_PROXY=.*/EXTERNAL_PROXY=true/' .env || echo 'EXTERNAL_PROXY=true' >> .env
            grep -q '^PROXY_PORT=' .env || echo 'PROXY_PORT=3001' >> .env
            echo "=== git pull ==="
            git fetch origin && git checkout claude/dreamy-johnson-pUcCJ && git pull --ff-only origin claude/dreamy-johnson-pUcCJ
            echo "=== deploy.sh ==="
            ./deploy.sh 2>&1 | tail -20
            echo "=== контейнеры ==="
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml ps 2>&1 | tail -8
            echo "=== app на 127.0.0.1:3001? ==="
            sudo ss -ltnp 2>/dev/null | grep ':3001 ' || echo "(3001 не слушается — проверить)"
            echo "=== проверка через общий Caddy (Host: alex-finance.pro) ==="
            curl -sS -k -m 10 -i -H "Host: alex-finance.pro" https://127.0.0.1/ 2>&1 | grep -iE '^HTTP/|^location:' | head -5 || echo "(нет ответа)"
