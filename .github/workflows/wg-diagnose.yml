name: WG diagnose

# Одноразовая диагностика WireGuard-туннеля tgwg по SSH (только вручную):
# показывает handshake/endpoint/трафик и маршрут до Telegram — чтобы отличить
# мёртвый пир (нужен новый конфиг) от проблемы маршрутизации.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect tunnel over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            SUDO=''; [ "$(id -u)" -ne 0 ] && SUDO=sudo
            echo "=== wg show tgwg (peer / endpoint / latest handshake / transfer) ==="
            $SUDO wg show tgwg 2>&1 | cat || echo "wg show: интерфейс не найден"
            echo "=== маршрут до Telegram IP (должен идти через tgwg) ==="
            ip route get 149.154.167.220 2>&1 | cat || true
            echo "=== проба связи через туннель (curl -v, тайминги) ==="
            $SUDO curl -sS -m 15 -o /dev/null -w "telegram HTTP %{http_code}, время %{time_total}s\n" https://api.telegram.org 2>&1 || echo "curl: соединение не установилось"
            echo "=== UDP-порт пира доступен? (handshake ходит по UDP) ==="
            ep=$($SUDO wg show tgwg endpoints 2>/dev/null | awk '{print $2}' | head -1)
            echo "endpoint: ${ep:-<нет>}"
