name: Force crypto sync

# Разовый форс крипто-синка по SSH (только вручную): дёргает /api/sync/crypto
# и показывает TON-кошельки из БД (balance | balanceUsd) — чтобы сразу увидеть
# переоценку после фикса цены (TON→GRAM), не дожидаясь 10-минутного крона.
on:
  workflow_dispatch: {}

jobs:
  force:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger crypto sync over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            cd "$HOME/capital" || { echo "Нет каталога ~/capital"; exit 1; }
            CRON=$(grep -E '^CRON_SECRET=' .env 2>/dev/null | tail -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs)
            echo "=== POST /api/sync/crypto ==="
            curl -s -m 120 -X POST -H "x-cron-key: $CRON" http://127.0.0.1:3000/api/sync/crypto | head -c 500; echo
            echo "=== TON-кошельки в БД после синка (адрес | balance | balanceUsd | lastSync) ==="
            docker exec capital-db-1 psql -U capital -d capital -t -A -F' | ' -c "SELECT address, balance, \"balanceUsd\", to_char(\"lastSyncedAt\",'MM-DD HH24:MI') FROM \"Wallet\" WHERE chain='TON';" 2>&1 | cat
