name: Apply secret expenses sheet

# Вписывает GOOGLE_SHEETS_SECRET_ID (и опц. GOOGLE_SHEETS_SECRET_TAB) из GitHub-секретов
# в /opt/capital/.env, пересоздаёт app+worker, прогоняет синк секретных расходов и
# показывает, сколько строк прочитано. ID в логах маскируется, если добавлен как секрет.
on:
  workflow_dispatch: {}

jobs:
  apply:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inject secret sheet id, recreate, sync over SSH
        uses: appleboy/ssh-action@v1
        env:
          SECRET_ID: ${{ secrets.GOOGLE_SHEETS_SECRET_ID }}
          SECRET_TAB: ${{ secrets.GOOGLE_SHEETS_SECRET_TAB }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SECRET_ID,SECRET_TAB
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            if [ -z "$SECRET_ID" ]; then echo "✗ секрет GOOGLE_SHEETS_SECRET_ID пуст — добавьте его в GitHub → Settings → Secrets → Actions"; exit 1; fi
            echo "=== вписываю GOOGLE_SHEETS_SECRET_ID в .env ==="
            if grep -q '^GOOGLE_SHEETS_SECRET_ID=' .env; then
              sed -i "s|^GOOGLE_SHEETS_SECRET_ID=.*|GOOGLE_SHEETS_SECRET_ID=\"$SECRET_ID\"|" .env
            else
              printf 'GOOGLE_SHEETS_SECRET_ID="%s"\n' "$SECRET_ID" >> .env
            fi
            if [ -n "$SECRET_TAB" ]; then
              if grep -q '^GOOGLE_SHEETS_SECRET_TAB=' .env; then sed -i "s|^GOOGLE_SHEETS_SECRET_TAB=.*|GOOGLE_SHEETS_SECRET_TAB=\"$SECRET_TAB\"|" .env; else printf 'GOOGLE_SHEETS_SECRET_TAB="%s"\n' "$SECRET_TAB" >> .env; fi
            fi
            echo "GOOGLE_SHEETS_SECRET_ID в .env: $(grep -q '^GOOGLE_SHEETS_SECRET_ID=' .env && echo да || echo нет)"
            echo "=== пересоздаю app+worker (подхватить env) ==="
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d app worker 2>&1 | tail -6
            sleep 10
            echo "=== синк секретных расходов ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/secret-expenses",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>console.log(JSON.stringify(j).slice(0,400))).catch(e=>console.log("ERR",String(e).slice(0,160)))' 2>&1 | tail -3
            echo "=== строк секретных расходов в БД ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -c "SELECT count(*) FROM \"SecretExpenseTxn\";" 2>&1 | head -2
