name: Apply expenses account

# Создаёт/обновляет ограниченный аккаунт «расходы» (role=expenses).
# ВАЖНО: пароль НЕ вписывается в .env (там sed/кавычки/интерполяция compose искажают
# спецсимволы). Вместо этого пароль передаётся напрямую в процесс через docker exec -e
# — байт-в-байт, без искажений. Затем проверяем bcrypt.compare прямо в контейнере.
# Пароль в логах маскируется GitHub Actions.
on:
  workflow_dispatch: {}

jobs:
  apply:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create/verify expenses account over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXP_PASSWORD: ${{ secrets.EXPENSES_PASSWORD }}
          EXP_EMAIL: ${{ secrets.EXPENSES_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXP_PASSWORD,EXP_EMAIL
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            if [ -z "$EXP_PASSWORD" ]; then echo "✗ секрет EXPENSES_PASSWORD пуст — добавьте его в GitHub → Settings → Secrets → Actions"; exit 1; fi
            EMAIL_VAL="${EXP_EMAIL:-expenses@capital.local}"
            echo "=== убираю EXPENSES_PASSWORD из .env (чтобы entrypoint не пересоздал аккаунт с искажённым паролем) ==="
            sed -i '/^EXPENSES_PASSWORD=/d' .env || true
            if grep -q '^EXPENSES_EMAIL=' .env; then
              sed -i "s|^EXPENSES_EMAIL=.*|EXPENSES_EMAIL=\"$EMAIL_VAL\"|" .env
            else
              printf 'EXPENSES_EMAIL="%s"\n' "$EMAIL_VAL" >> .env
            fi
            echo "email аккаунта: $EMAIL_VAL"
            echo "=== создаю/обновляю аккаунт напрямую (пароль байт-в-байт через docker exec -e) ==="
            docker exec -e EXPENSES_PASSWORD="$EXP_PASSWORD" -e EXPENSES_EMAIL="$EMAIL_VAL" capital-app-1 npx tsx prisma/ensure-expenses-user.ts 2>&1 | tail -3
            echo "=== проверка: bcrypt.compare(введённый пароль, хэш в БД) прямо в контейнере ==="
            docker exec -e EXP_CHK="$EXP_PASSWORD" -e EMAIL_VAL="$EMAIL_VAL" capital-app-1 node -e 'const{PrismaClient}=require("@prisma/client");const b=require("bcryptjs");const p=new PrismaClient();const pw=(process.env.EXP_CHK||"").trim();p.user.findUnique({where:{email:process.env.EMAIL_VAL}}).then(u=>{if(!u)return console.log("нет пользователя");return b.compare(pw,u.passwordHash).then(ok=>console.log("compare:",ok,"| role:",u.role,"| длина пароля:",pw.length))}).catch(e=>console.log("ERR",String(e).slice(0,120))).finally(()=>p.$disconnect())' 2>&1 | tail -3
            echo "=== пользователи в БД ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT email, role FROM \"User\" ORDER BY \"createdAt\";" 2>&1 | head -10
