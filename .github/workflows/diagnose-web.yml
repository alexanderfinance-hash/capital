name: Diagnose web

# Разовая диагностика веб-слоя по SSH: кто слушает 80/443, статус/логи Caddy,
# и какой Location реально отдают app и Caddy для alex-finance.pro. Нужно понять,
# откуда берётся редирект на localhost:3001.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe web over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== кто слушает 80/443/3000/3001 ==="
            sudo ss -ltnp 2>/dev/null | grep -E ':80 |:443 |:3000 |:3001 ' || echo "(ничего не найдено)"
            echo "=== docker ps (имя | статус | порты) ==="
            docker ps --format '{{.Names}} | {{.Status}} | {{.Ports}}'
            echo "=== логи нашего Caddy (хвост) ==="
            docker logs --tail 20 capital-caddy-1 2>&1 | tail -20 || echo "capital-caddy-1 нет"
            echo "=== app: куда редиректит (прямо в контейнер) ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/",{redirect:"manual"}).then(r=>console.log("status",r.status,"| location:",r.headers.get("location"))).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,100)))' 2>&1 | cat
            echo "=== через Caddy на 443 с Host: alex-finance.pro ==="
            curl -sS -k -m 10 -i -H "Host: alex-finance.pro" https://127.0.0.1/ 2>&1 | grep -iE '^HTTP/|^location:' | head -5 || echo "(нет ответа)"
            echo "=== через Caddy на 80 с Host: alex-finance.pro ==="
            curl -sS -m 10 -i -H "Host: alex-finance.pro" http://127.0.0.1/ 2>&1 | grep -iE '^HTTP/|^location:' | head -5 || echo "(нет ответа)"
