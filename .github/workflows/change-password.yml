name: Change password

# Смена пароля входа в дашборд БЕЗ ручного входа на сервер.
# Берёт новый пароль из GitHub Secret NEW_APP_PASSWORD, по SSH (тот же канал,
# что и авто-деплой) обновляет bcrypt-хэш пользователя в БД скриптом
# prisma/set-password.ts и синхронизирует APP_PASSWORD в ~/capital/.env.
# Значение пароля в логи не выводится (GitHub маскирует секреты).
#
# Запуск: Settings → Secrets → Actions → задать NEW_APP_PASSWORD,
# затем вкладка Actions → Change password → Run workflow.
# Предусловия: секреты VPS_* (как для деплоя) и переменная DEPLOY_ENABLED=true.
on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  change-password:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Update login password on server
        uses: appleboy/ssh-action@v1
        env:
          NEW_PW: ${{ secrets.NEW_APP_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEW_PW
          script_stop: true
          script: |
            set -e
            cd "$HOME/capital" || { echo "Нет каталога ~/capital"; exit 1; }
            if [ -z "$NEW_PW" ]; then
              echo "Секрет NEW_APP_PASSWORD пуст — задайте его в Settings → Secrets → Actions"; exit 1;
            fi
            if [ "${#NEW_PW}" -lt 4 ]; then
              echo "Пароль слишком короткий (минимум 4 символа)"; exit 1;
            fi
            # Обновить bcrypt-хэш в БД — вход меняется сразу, данные не трогаются.
            docker exec -e NEW_PASSWORD="$NEW_PW" capital-app-1 npx tsx prisma/set-password.ts
            # Синхронизировать APP_PASSWORD в .env (используется при первичном
            # сиде пустой БД и как dev-фолбэк) — идемпотентно, как в Configure Telegram.
            touch .env
            grep -vE '^APP_PASSWORD=' .env > .env.tmp 2>/dev/null || true
            mv .env.tmp .env
            printf 'APP_PASSWORD="%s"\n' "$NEW_PW" >> .env
            echo "→ Пароль обновлён в БД, APP_PASSWORD в .env синхронизирован."
            # Пересоздать контейнеры с новым окружением (только если env изменился).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            echo "→ Готово: войдите на сайт с новым паролем."
