name: Check pnl

# Разбор роста личного капитала/крипты: снимки по дням + состав активов + цены.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== крипто-снимки по дням (макс/мин за день, посл. 40 дней) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT date_trunc('day',\"capturedAt\")::date d, round(max(value)) mx, round(min(value)) mn FROM \"CapitalSnapshot\" WHERE scope='crypto' AND \"capturedAt\" > now() - interval '40 days' GROUP BY d ORDER BY d;" 2>&1 | tail -42
            echo "=== personal-снимки по дням (макс за день, посл. 40 дней) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT date_trunc('day',\"capturedAt\")::date d, round(max(value)) mx FROM \"CapitalSnapshot\" WHERE scope='personal' AND \"capturedAt\" > now() - interval '40 days' GROUP BY d ORDER BY d;" 2>&1 | tail -42
            echo "=== состав активов (топ по value) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT name, symbol, round(coalesce(amount,0),4) amt, round(value) val, bucket, source, liability FROM \"Asset\" ORDER BY value DESC LIMIT 20;" 2>&1 | head -22
            echo "=== цены монет ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT symbol, round(usd,4), \"fetchedAt\" FROM \"PriceCache\" ORDER BY symbol;" 2>&1 | head -10
