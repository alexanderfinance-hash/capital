name: Check pnl

# Обновить TELEGRAM_BOT_TOKEN из секрета (новый выделенный бот дашборда), сбросить
# курсор TelegramState (у нового бота своя нумерация update_id), пересоздать app,
# проверить getMe и прогнать реальный синк агентств. Токен маскируется Actions.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Swap bot token + resync over SSH
        uses: appleboy/ssh-action@v1
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TG_TOKEN
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            if [ -z "$TG_TOKEN" ]; then echo "✗ секрет TELEGRAM_BOT_TOKEN пуст"; exit 1; fi
            echo "=== вписываю новый TELEGRAM_BOT_TOKEN в .env ==="
            if grep -q '^TELEGRAM_BOT_TOKEN=' .env; then
              sed -i "s|^TELEGRAM_BOT_TOKEN=.*|TELEGRAM_BOT_TOKEN=\"$TG_TOKEN\"|" .env
            else
              printf 'TELEGRAM_BOT_TOKEN="%s"\n' "$TG_TOKEN" >> .env
            fi
            echo "TELEGRAM_BOT_TOKEN в .env: $(grep -q '^TELEGRAM_BOT_TOKEN=' .env && echo да || echo нет)"
            echo "=== сбрасываю курсор TelegramState (новый бот — своя нумерация) ==="
            docker exec capital-db-1 psql -U capital -d capital -c "DELETE FROM \"TelegramState\" WHERE id='default';" 2>&1 | tail -2
            echo "=== пересоздаю app+worker (подхватить новый токен) ==="
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d app worker 2>&1 | tail -6
            sleep 12
            echo "=== getMe (кто теперь бот) ==="
            docker exec capital-app-1 node -e 'fetch("https://api.telegram.org/bot"+process.env.TELEGRAM_BOT_TOKEN+"/getMe").then(r=>r.json()).then(j=>console.log(j.ok?("@"+j.result.username+" / read_all="+j.result.can_read_all_group_messages):("ERR "+j.description))).catch(e=>console.log("ERR",String(e).slice(0,120)))' 2>&1 | tail -2
            echo "=== реальный синк агентств ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/telegram",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>console.log(JSON.stringify(j).slice(0,700))).catch(e=>console.log("ERR",String(e).slice(0,150)))' 2>&1 | tail -3
            echo "=== свежесть агентств (топ по updatedAt) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT platform, balance, \"enteredBy\", \"updatedAt\" FROM \"Agency\" ORDER BY \"updatedAt\" DESC LIMIT 6;" 2>&1 | head -8
