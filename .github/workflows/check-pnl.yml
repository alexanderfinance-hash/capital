name: Check pnl

# Разовая проверка стабильности P&L-API: дёргаем scope="all" net 3 раза подряд и
# смотрим updatedAt — понять, плавают ли данные (пересчёт на платформе) или это
# устойчивый ответ. Только чтение.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            docker exec capital-app-1 node -e '
              const t=process.env.PNL_API_TOKEN,u=process.env.PNL_API_URL||"https://finance-company.online/api/integrations/pnl";
              (async()=>{for(let i=0;i<3;i++){try{
                const j=await (await fetch(u+"?mode=month&periods=6",{headers:{Authorization:"Bearer "+t}})).json();
                const scopes=(j.projects||[]).map(p=>p.scope);
                const a=(j.projects||[]).find(p=>p.scope==="all");
                console.log("probe",i+1,"| updatedAt",j.updatedAt,"| scopes",JSON.stringify(scopes));
                console.log("   all  net",JSON.stringify(a&&a.net));
                const cl=(j.projects||[]).find(p=>p.scope==="coinlink");const un=(j.projects||[]).find(p=>p.scope==="unico");
                console.log("   coinlink",JSON.stringify(cl&&cl.net),"| unico",JSON.stringify(un&&un.net));
              }catch(e){console.log("probe",i+1,"ERR",String(e&&e.cause||e).slice(0,120));}
              await new Promise(r=>setTimeout(r,1500));}})();
            ' 2>&1 | tail -12
