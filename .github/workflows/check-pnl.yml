name: Check pnl

# Расход по ассистентам ПО МЕСЯЦАМ (июн/июл/авг 2026): сумма<0 + непустая Статья.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assistant spend by month over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 6m
          script: |
            cat > /tmp/dds.js <<'EOF'
            const { google } = require("googleapis");
            const fs = require("fs");
            function creds(){ const raw=process.env.GOOGLE_SERVICE_ACCOUNT_JSON; if(raw){try{return JSON.parse(raw);}catch(e){}} const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; if(p){try{return JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){}} return null; }
            function parseNum(s){ let t=String(s==null?"":s).replace(/[^\d.,-]/g,"").replace(/\s/g,""); if(t.includes(",")&&!t.includes("."))t=t.replace(",","."); const n=parseFloat(t); return isNaN(n)?0:n; }
            function md(d){ const m=String(d||"").trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(!m) return null; return {mo:+m[2], y:+m[3]}; }
            const MONTHS=[6,7,8], Y=2026;
            (async()=>{
              const c=creds(); const auth=new google.auth.JWT({email:c.client_email,key:c.private_key,scopes:["https://www.googleapis.com/auth/spreadsheets.readonly"]});
              const sheets=google.sheets({version:"v4",auth}); const id=process.env.GOOGLE_SHEETS_ID;
              const res=await sheets.spreadsheets.values.get({spreadsheetId:id, range:`'ДДС'!A1:K30000`});
              const rows=res.data.values||[]; const D=3,SUM=4,ASS=6,ST=8;
              const by=new Map(); const totMonth={6:0,7:0,8:0};
              for(let r=1;r<rows.length;r++){ const row=rows[r]||[];
                const v=parseNum(row[SUM]); if(!(v<0)) continue;
                const t=md(row[D]); if(!t||t.y!==Y||!MONTHS.includes(t.mo)) continue;
                const st=String(row[ST]||"").trim(); if(!st) continue;
                const rub=Math.abs(v); const a=String(row[ASS]||"").trim()||"(не указан)";
                const cur=by.get(a)||{6:0,7:0,8:0,tot:0}; cur[t.mo]+=rub; cur.tot+=rub; by.set(a,cur);
                totMonth[t.mo]+=rub;
              }
              const f=x=>Math.round(x).toLocaleString("ru-RU");
              console.log("=== Расход по ассистентам по месяцам, ₽ (только с категорией) ===");
              console.log("ассистент | июнь | июль | август | ИТОГО");
              [...by.entries()].sort((a,b)=>b[1].tot-a[1].tot).forEach(([a,v])=>console.log(`${a} | ${f(v[6])} | ${f(v[7])} | ${f(v[8])} | ${f(v.tot)}`));
              console.log(`ВСЕГО | ${f(totMonth[6])} | ${f(totMonth[7])} | ${f(totMonth[8])} | ${f(totMonth[6]+totMonth[7]+totMonth[8])}`);
            })().catch(e=>console.log("ERR", String(e&&e.message||e).slice(0,300)));
            EOF
            WD=$(docker exec capital-app-1 pwd | tr -d "\r")
            docker cp /tmp/dds.js capital-app-1:"$WD/dds_probe.js" >/dev/null 2>&1
            docker exec -w "$WD" capital-app-1 node dds_probe.js 2>&1 | head -40
            docker exec capital-app-1 rm -f "$WD/dds_probe.js" >/dev/null 2>&1 || true
