name: Check pnl

# Разовая диагностика (только чтение): полная структура ответа P&L-API за 7 мес
# (янв–июл), чтобы понять, какое поле объекта scope="all" соответствует «Чистой
# прибыли» из UI платформы (сейчас дашборд тянет net, и он не сходится).
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            docker exec capital-app-1 node -e '
              const t=process.env.PNL_API_TOKEN,u=process.env.PNL_API_URL||"https://finance-company.online/api/integrations/pnl";
              fetch(u+"?mode=month&periods=7",{headers:{Authorization:"Bearer "+t}}).then(r=>r.json()).then(j=>{
                console.log("updatedAt",j.updatedAt,"currency",j.currency);
                console.log("topLevelKeys",JSON.stringify(Object.keys(j)));
                console.log("periods",JSON.stringify((j.periods||[]).map(p=>p.key)));
                const all=(j.projects||[]).find(p=>p.scope==="all");
                console.log("scope=all keys",JSON.stringify(Object.keys(all||{})));
                console.log("scope=all FULL",JSON.stringify(all));
              }).catch(e=>console.log("ERR",String(e&&e.cause||e).slice(0,200)));
            ' 2>&1 | tail -30
