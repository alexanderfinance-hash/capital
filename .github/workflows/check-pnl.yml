name: Check pnl

# Разведка расходов: категории за 3 мес + поиск «ассист» по полям + разбивка.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== категории (Статья) за 3 мес: сумма ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT COALESCE(NULLIF(parent,''),'(без категории)') p, count(*) n, round(sum(value)) s FROM \"ExpenseTransaction\" WHERE date >= '2026-06-01' GROUP BY p ORDER BY s DESC;" 2>&1 | head -40
            echo "=== строки со словом 'ассист' (parent/sub/comment) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT parent, sub, count(*) n, round(sum(value)) s FROM \"ExpenseTransaction\" WHERE date >= '2026-06-01' AND (parent ILIKE '%ассист%' OR sub ILIKE '%ассист%' OR comment ILIKE '%ассист%') GROUP BY parent, sub ORDER BY s DESC;" 2>&1 | head -40
            echo "=== если есть категория про ассистентов — разбивка по подкатегориям ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT parent, sub, count(*) n, round(sum(value)) s FROM \"ExpenseTransaction\" WHERE date >= '2026-06-01' AND parent ILIKE '%ассист%' GROUP BY parent, sub ORDER BY s DESC;" 2>&1 | head -40
