name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe expenses now over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== Расходы по месяцам (ExpenseMonth), USD ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT to_char(\"monthStart\",'YYYY-MM') period, round(value) usd FROM \"ExpenseMonth\" ORDER BY \"monthStart\" DESC LIMIT 6;" 2>&1 | head -8
            echo "=== Коучи/наставничество в расходах (должно быть 0) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT count(*) FROM \"ExpenseTransaction\" WHERE sub ILIKE '%коуч%' OR sub ILIKE '%наставн%';" 2>&1 | head -2
            echo "=== В инвестициях (OtherInvestment), USD ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT round(sum(value)) total, count(*) FROM \"OtherInvestment\";" 2>&1 | head -2
            echo "=== категории сентября (топ) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT name, round(value) usd FROM \"ExpenseCategory\" WHERE period='2026-09' ORDER BY value DESC LIMIT 8;" 2>&1 | head -10
