name: Check pnl

# Ищем во всех вкладках ДДС столбец «Ассистент»: печатаем вкладку, шапку, примеры.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Find assistant column over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 6m
          script: |
            cat > /tmp/dds.js <<'EOF'
            const { google } = require("googleapis");
            const fs = require("fs");
            function creds(){
              const raw = process.env.GOOGLE_SERVICE_ACCOUNT_JSON;
              if (raw){ try { return JSON.parse(raw); } catch(e){} }
              const p = process.env.GOOGLE_APPLICATION_CREDENTIALS;
              if (p){ try { return JSON.parse(fs.readFileSync(p,"utf8")); } catch(e){} }
              return null;
            }
            const norm = s => String(s||"").trim().toLowerCase();
            (async()=>{
              const c = creds(); if(!c){ console.log("нет creds"); return; }
              const auth = new google.auth.JWT({ email:c.client_email, key:c.private_key, scopes:["https://www.googleapis.com/auth/spreadsheets.readonly"] });
              const sheets = google.sheets({ version:"v4", auth });
              const id = process.env.GOOGLE_SHEETS_DDS_ID || "1fwMFtSgOUdSfmgVS3SwrYpFvwsxiPBXpL0SBVLdlaLs";
              const meta = await sheets.spreadsheets.get({ spreadsheetId:id, fields:"sheets.properties.title" });
              const tabs = (meta.data.sheets||[]).map(s=>s.properties.title);
              for (const tab of tabs){
                let rows;
                try { const res = await sheets.spreadsheets.values.get({ spreadsheetId:id, range:`'${tab}'!A1:AF14` }); rows = res.data.values||[]; }
                catch(e){ continue; }
                for(let r=0;r<Math.min(rows.length,14);r++){
                  const cells=(rows[r]||[]).map(norm);
                  const ai=cells.findIndex(x=>x.includes("ассист"));
                  if(ai>=0){
                    console.log("=== TAB:", tab, "| строка шапки:", r, "| Ассистент = колонка", ai, "===");
                    console.log("HEADER:", JSON.stringify(rows[r]));
                    for(let k=r+1;k<Math.min(r+4,rows.length);k++) console.log("row:", JSON.stringify(rows[k]));
                    break;
                  }
                }
              }
              console.log("готово");
            })().catch(e=>console.log("ERR", String(e&&e.message||e).slice(0,300)));
            EOF
            WD=$(docker exec capital-app-1 pwd | tr -d "\r")
            docker cp /tmp/dds.js capital-app-1:"$WD/dds_probe.js" >/dev/null 2>&1
            docker exec -w "$WD" capital-app-1 node dds_probe.js 2>&1 | head -60
            docker exec capital-app-1 rm -f "$WD/dds_probe.js" >/dev/null 2>&1 || true
