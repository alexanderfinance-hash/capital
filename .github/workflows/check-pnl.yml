name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Service account email over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 3m
          script: |
            docker exec capital-app-1 node -e '
              const fs=require("fs");
              let c=null; const raw=process.env.GOOGLE_SERVICE_ACCOUNT_JSON;
              if(raw){try{c=JSON.parse(raw);}catch(e){}}
              if(!c){const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; if(p){try{c=JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){}}}
              console.log("service account email:", c? c.client_email : "нет creds");
              console.log("GOOGLE_SHEETS_ID:", process.env.GOOGLE_SHEETS_ID||"(нет)");
            ' 2>&1 | tail -5
