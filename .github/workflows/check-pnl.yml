name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wire secret sheet + sync over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 8m
          script: |
            cd /opt/capital || { echo "нет /opt/capital"; exit 1; }
            ID="1g3YPHFe1gAfZg4PxiwCgsZU6kmYzQe-5ka5J8Me2HJI"
            echo "=== вписываю GOOGLE_SHEETS_SECRET_ID в .env ==="
            if grep -q '^GOOGLE_SHEETS_SECRET_ID=' .env; then
              sed -i "s|^GOOGLE_SHEETS_SECRET_ID=.*|GOOGLE_SHEETS_SECRET_ID=\"$ID\"|" .env
            else
              printf 'GOOGLE_SHEETS_SECRET_ID="%s"\n' "$ID" >> .env
            fi
            echo "в .env: $(grep -q '^GOOGLE_SHEETS_SECRET_ID=' .env && echo да || echo нет)"
            echo "=== пересоздаю app+worker ==="
            docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d app worker 2>&1 | tail -6
            sleep 12
            echo "=== синк секретных расходов ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/secret-expenses",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>console.log(JSON.stringify(j))).catch(e=>console.log("ERR",String(e).slice(0,160)))' 2>&1 | tail -3
            echo "=== SecretExpenseTxn: строк + сумма USD + по статьям ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT count(*), round(sum(value)) FROM \"SecretExpenseTxn\";" 2>&1 | head -2
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT parent, round(sum(value)) usd, count(*) FROM \"SecretExpenseTxn\" GROUP BY parent ORDER BY 2 DESC LIMIT 10;" 2>&1 | head -12
