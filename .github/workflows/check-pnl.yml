name: Check pnl

# Проверка: что видит новый бот и что подтянул синк агентств.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify telegram sync over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== пик очереди updates (getUpdates -10, без подтверждения) ==="
            docker exec capital-app-1 node -e '
              const T=process.env.TELEGRAM_BOT_TOKEN;
              const api=(m,p)=>fetch("https://api.telegram.org/bot"+T+"/"+m,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p||{})}).then(r=>r.json());
              (async()=>{
                const me=await api("getMe"); console.log("bot",me.result&&("@"+me.result.username));
                const up=await api("getUpdates",{offset:-10,timeout:0,allowed_updates:["message","channel_post","edited_message","edited_channel_post"]});
                const arr=up.result;
                console.log("getUpdates(-10):",Array.isArray(arr)?("count "+arr.length):("ERR "+(up.description||"")));
                (Array.isArray(arr)?arr:[]).forEach(u=>{const m=u.message||u.channel_post||u.edited_message||u.edited_channel_post;if(!m)return;const t=(m.text||m.caption||"").replace(/\n/g," ").slice(0,80);console.log("  upd",u.update_id,new Date(m.date*1000).toISOString(),"chat",m.chat&&m.chat.id,"user","@"+((m.from&&m.from.username)||"-"),"txt:",t);});
              })();
            ' 2>&1 | tail -16
            echo "=== реальный синк агентств ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/telegram",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>console.log(JSON.stringify(j).slice(0,900))).catch(e=>console.log("ERR",String(e).slice(0,150)))' 2>&1 | tail -4
            echo "=== свежесть агентств (топ по updatedAt) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT platform, balance, \"enteredBy\", \"updatedAt\" FROM \"Agency\" ORDER BY \"updatedAt\" DESC LIMIT 8;" 2>&1 | head -10
