name: Check pnl

# Диагностика DAIG: что в очереди updates, что подтянул синк (entries), значение DAIG в БД.
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== пик очереди updates (getUpdates -10) ==="
            docker exec capital-app-1 node -e '
              const T=process.env.TELEGRAM_BOT_TOKEN;
              fetch("https://api.telegram.org/bot"+T+"/getUpdates",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({offset:-10,timeout:0,allowed_updates:["message","channel_post","edited_message","edited_channel_post"]})}).then(r=>r.json()).then(j=>{
                const arr=j.result||[];console.log("count",arr.length);
                arr.forEach(u=>{const m=u.message||u.channel_post||u.edited_message||u.edited_channel_post;if(!m)return;const daig=(m.text||"").split("\n").filter(l=>/daig/i.test(l));console.log("upd",u.update_id,new Date(m.date*1000).toISOString(),"@"+((m.from&&m.from.username)||"-"),"entities",(m.entities||[]).length,"DAIG-строка:",JSON.stringify(daig));});
              }).catch(e=>console.log("ERR",String(e).slice(0,120)));
            ' 2>&1 | tail -8
            echo "=== реальный синк агентств (полный список entries) ==="
            docker exec capital-app-1 node -e 'fetch("http://localhost:3000/api/sync/telegram",{method:"POST",headers:{"x-cron-key":process.env.CRON_SECRET}}).then(r=>r.json()).then(j=>{console.log("ok",j.ok,"consumed",j.consumed,"messageAt",j.messageAt,"updated",j.updated,"created",j.created);(j.entries||[]).forEach(e=>console.log("  ",e.action,JSON.stringify(e.name),e.amount));}).catch(e=>console.log("ERR",String(e).slice(0,150)))' 2>&1 | tail -30
            echo "=== DAIG в БД ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT platform, balance, \"enteredBy\", \"updatedAt\" FROM \"Agency\" WHERE platform ILIKE '%daig%';" 2>&1 | head -5
