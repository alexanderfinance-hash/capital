name: Check pnl

# Диагностика: состоит ли бот в настроенном чате (getChat/getChatMember), и что
# в очереди updates. Помогает отличить «бот не в том чате» от «апдейты съедает
# другой потребитель того же токена».
on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe telegram over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            docker exec capital-app-1 node -e '
              const T=process.env.TELEGRAM_BOT_TOKEN,CHAT=process.env.TELEGRAM_CHAT_ID||"";
              const api=(m,p)=>fetch("https://api.telegram.org/bot"+T+"/"+m,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(p||{})}).then(r=>r.json());
              (async()=>{
                const me=await api("getMe"); const botId=me.result&&me.result.id;
                console.log("bot",me.result&&("@"+me.result.username+"/"+botId));
                console.log("CHAT_ID",CHAT);
                const gc=await api("getChat",{chat_id:CHAT});
                console.log("getChat:", gc.ok ? JSON.stringify({id:gc.result.id,title:gc.result.title,type:gc.result.type}) : ("ERR "+gc.error_code+" "+gc.description));
                const cnt=await api("getChatMemberCount",{chat_id:CHAT});
                console.log("memberCount:", cnt.ok?cnt.result:("ERR "+cnt.description));
                const mem=await api("getChatMember",{chat_id:CHAT,user_id:botId});
                console.log("botMembership:", mem.ok?JSON.stringify({status:mem.result.status}):("ERR "+mem.description));
                const up=await api("getUpdates",{offset:-10,timeout:0,allowed_updates:["message","channel_post","edited_message","edited_channel_post"]});
                const arr=up.result;
                console.log("getUpdates(-10):",Array.isArray(arr)?("count "+arr.length):("ERR "+(up.description||"")));
                (Array.isArray(arr)?arr:[]).forEach(u=>{const m=u.message||u.channel_post||u.edited_message||u.edited_channel_post;if(!m)return;const t=(m.text||m.caption||"").replace(/\n/g," ").slice(0,80);console.log("  upd",u.update_id,new Date(m.date*1000).toISOString(),"chat",m.chat&&m.chat.id,"user","@"+((m.from&&m.from.username)||"-"),"txt:",t);});
              })();
            ' 2>&1 | tail -16
