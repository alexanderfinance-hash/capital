name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Weekly report over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== недели (weekEnd | label | USD) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT \"weekEnd\", label, round(value) FROM \"ExpenseWeek\" ORDER BY \"weekEnd\" DESC LIMIT 5;" 2>&1 | head -6
            echo "=== курс ЦБ (последний) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -c "SELECT usd FROM \"FxRate\" ORDER BY date DESC LIMIT 1;" 2>&1 | head -2
            echo "=== категории недели 07-13.09 (weekEnd=2026-09-13), USD ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT name, round(value,2) FROM \"ExpenseWeekCategory\" WHERE \"weekEnd\"='2026-09-13' ORDER BY value DESC;" 2>&1 | head -20
            echo "=== подкатегории недели 07-13.09, USD ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT parent, name, round(value,2) FROM \"ExpenseWeekSubcategory\" WHERE \"weekEnd\"='2026-09-13' ORDER BY value DESC LIMIT 25;" 2>&1 | head -26
