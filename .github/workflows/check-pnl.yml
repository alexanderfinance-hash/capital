name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Debug DDS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 6m
          script: |
            cat > /tmp/dds.js <<'EOF'
            const { google } = require("googleapis");
            const fs = require("fs");
            function creds(){ const raw=process.env.GOOGLE_SERVICE_ACCOUNT_JSON; if(raw){try{return JSON.parse(raw);}catch(e){}} const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; if(p){try{return JSON.parse(fs.readFileSync(p,"utf8"));}catch(e){}} return null; }
            function iso(d){ const m=String(d||"").trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); if(!m) return null; return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
            (async()=>{
              const c=creds(); const auth=new google.auth.JWT({email:c.client_email,key:c.private_key,scopes:["https://www.googleapis.com/auth/spreadsheets.readonly"]});
              const sheets=google.sheets({version:"v4",auth}); const id=process.env.GOOGLE_SHEETS_ID;
              const res=await sheets.spreadsheets.values.get({spreadsheetId:id, range:`'ДДС'!A1:K30000`});
              const rows=res.data.values||[];
              console.log("всего строк:", rows.length);
              console.log("HEADER:", JSON.stringify(rows[0]));
              console.log("последние 4 строки:");
              for(let r=Math.max(1,rows.length-4);r<rows.length;r++) console.log("  ", JSON.stringify(rows[r]));
              // распределение по типу (кол.10) и диапазон дат (кол.3)
              const types=new Map(); let minI=null,maxI=null, withDate=0, jun2aug=0;
              for(let r=1;r<rows.length;r++){ const row=rows[r]||[]; const t=String(row[10]||"").trim()||"(пусто)"; types.set(t,(types.get(t)||0)+1); const di=iso(row[3]); if(di){withDate++; if(!minI||di<minI)minI=di; if(!maxI||di>maxI)maxI=di; if(di>="2026-06-01"&&di<="2026-09-30")jun2aug++; } }
              console.log("типы (кол.10):", JSON.stringify([...types.entries()]));
              console.log("строк с датой:", withDate, "| диапазон:", minI, "…", maxI, "| в июне-сент:", jun2aug);
              // пример строки за август, если есть
              for(let r=1;r<rows.length;r++){ const di=iso((rows[r]||[])[3]); if(di&&di>="2026-08-01"&&di<="2026-08-31"){ console.log("пример авг:", JSON.stringify(rows[r])); break; } }
            })().catch(e=>console.log("ERR", String(e&&e.message||e).slice(0,300)));
            EOF
            WD=$(docker exec capital-app-1 pwd | tr -d "\r")
            docker cp /tmp/dds.js capital-app-1:"$WD/dds_probe.js" >/dev/null 2>&1
            docker exec -w "$WD" capital-app-1 node dds_probe.js 2>&1 | head -40
            docker exec capital-app-1 rm -f "$WD/dds_probe.js" >/dev/null 2>&1 || true
