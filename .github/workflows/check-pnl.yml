name: Check pnl

on:
  workflow_dispatch: {}

jobs:
  check:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe mentorship reclassify over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 4m
          script: |
            echo "=== ENV реклассификации ==="
            docker exec capital-app-1 node -e 'console.log("EXPENSE_RECLASSIFY_INVESTMENTS =", JSON.stringify(process.env.EXPENSE_RECLASSIFY_INVESTMENTS||"(нет)"), "| EXPENSE_AS_INVESTMENT =", JSON.stringify(process.env.EXPENSE_AS_INVESTMENT||"(нет, дефолт: Коучи\\преподаватели\\наставники)"))'
            echo "=== расходы, похожие на наставничество/коучей (последние 45 дней) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT date, parent, sub, round(value) usd FROM \"ExpenseTransaction\" WHERE date >= '2026-08-01' AND (parent ILIKE '%наставн%' OR sub ILIKE '%наставн%' OR parent ILIKE '%коуч%' OR sub ILIKE '%коуч%' OR sub ILIKE '%препод%') ORDER BY date DESC;" 2>&1 | head -20
            echo "=== ВСЕ уникальные подстатьи в расходах (чтобы увидеть точное имя) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT DISTINCT parent, sub FROM \"ExpenseTransaction\" WHERE sub ILIKE '%наставн%' OR sub ILIKE '%коуч%' OR sub ILIKE '%препод%' OR sub ILIKE '%обучен%' OR parent ILIKE '%развит%' OR parent ILIKE '%образов%';" 2>&1 | head -20
            echo "=== OtherInvestment (реклассифицированные в инвестиции) ==="
            docker exec capital-db-1 psql -U capital -d capital -tA -F' | ' -c "SELECT parent, name, round(value) usd FROM \"OtherInvestment\" ORDER BY value DESC LIMIT 10;" 2>&1 | head -12
